services:
  db:
    image: postgres:16-alpine
    container_name: collabspace-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: collabuser
      POSTGRES_PASSWORD: collabpassword
      POSTGRES_DB: collabspace
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
